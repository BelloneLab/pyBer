name: Build and Publish

on:
  push:
    branches: [main, master, Pyber_v0.15]
    tags: ["v*"]
  pull_request:
    branches: [main, master, Pyber_v0.15]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: v0.47

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: "1"
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: pyBer
          auto-activate-base: false
          environment-file: environment.yml
          channels: conda-forge
          channel-priority: strict
          use-mamba: true

      - name: Show build environment
        run: |
          python --version
          python -m pip --version
          python -m PyInstaller --version
          python -c "import os, sys; print('CONDA_PREFIX=', os.environ.get('CONDA_PREFIX')); print('PYTHON=', sys.executable)"

      - name: Ensure icon asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          png_path = Path("assets/pyBer_logo_big.png")
          ico_path = Path("assets/pyBer.ico")
          if not png_path.is_file():
              raise SystemExit(f"Missing required PNG icon source: {png_path}")
          if not ico_path.is_file():
              img = Image.open(png_path).convert("RGBA")
              img.save(ico_path, sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
              print(f"Generated missing icon: {ico_path}")
          else:
              print(f"Using checked-in icon: {ico_path}")
          PY

      - name: Verify build inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy, scipy, h5py, sklearn

          required = [
              Path("pyBer.spec"),
              Path("pyBer-cli.spec"),
              Path("assets/pyBer_logo_big.png"),
              Path("assets/pyBer.ico"),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("Missing required build inputs: " + ", ".join(missing))

          print("Build inputs OK")
          print("Import smoke test OK")
          print("numpy:", numpy.__version__)
          print("scipy:", scipy.__version__)
          print("h5py:", h5py.__version__)
          print("sklearn:", sklearn.__version__)
          PY

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean pyBer.spec
          python -m PyInstaller --noconfirm --clean pyBer-cli.spec

      - name: Smoke test built EXE
        run: |
          export PYBER_SMOKE_TEST=1
          ./dist/pyBer/pyBer.exe
          ./dist/pyBer-cli.exe --version

      - name: Package GUI folder
        # The GUI is a one-dir build (one-file re-extracted the whole bundle
        # on every launch); ship the folder as a zip.
        run: |
          pwsh -Command "Compress-Archive -Path dist/pyBer -DestinationPath dist/pyBer-windows.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyber-windows-exe
          path: |
            dist/pyBer-windows.zip
            dist/pyBer-cli.exe
          if-no-files-found: error

  publish:
    needs: [build-windows]
    if: |
      needs.build-windows.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: pyber-windows-exe
          path: ./publish

      - name: Normalize Release Asset Name
        run: |
          set -euo pipefail
          gui_path="$(find ./publish -type f -name 'pyBer-windows.zip' | head -n 1 || true)"
          cli_path="$(find ./publish -type f -name 'pyBer-cli.exe' | head -n 1 || true)"
          if [[ -z "$gui_path" || -z "$cli_path" ]]; then
            echo "Expected GUI zip and CLI executable were not found"
            find ./publish -maxdepth 4 -type f -print || true
            exit 1
          fi
          if [[ "$gui_path" != "./publish/pyBer-windows.zip" ]]; then
            cp "$gui_path" ./publish/pyBer-windows.zip
          fi
          cp "$cli_path" ./publish/pyBer-cli-windows.exe

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./publish/pyBer-windows.zip,./publish/pyBer-cli-windows.exe"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_VERSION }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || env.RELEASE_VERSION }}
          prerelease: false
