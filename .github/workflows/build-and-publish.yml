name: Build and Publish

# Every push to main: tests, Windows executables, and a check of the packaged
# UI itself (PYBER_UI_AUDIT). When pyBer/version.py names a version that has no
# GitHub release yet, the same run publishes it. To release: bump the version,
# add docs/releases/<tag>.md, push. No manual tag is needed (pushing one still
# works and must match version.py).
on:
  push:
    branches: [main, master, Pyber_v0.15]
    tags: ["v*"]
  pull_request:
    branches: [main, master, Pyber_v0.15]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch supersedes an unfinished build of it.
# Tag builds are never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONNOUSERSITE: "1"
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Cache conda packages
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs_dir
          key: conda-pkgs-${{ runner.os }}-${{ hashFiles('environment.yml') }}

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: pyBer
          auto-activate-base: false
          environment-file: environment.yml
          channels: conda-forge
          channel-priority: strict
          use-mamba: true

      - name: Show build environment
        run: |
          python --version
          python -m pip --version
          python -m PyInstaller --version
          python -c "import os, sys; print('CONDA_PREFIX=', os.environ.get('CONDA_PREFIX')); print('PYTHON=', sys.executable)"
          python -c "import PySide6, PySide6.QtCore as c; print('PySide6', PySide6.__version__, 'Qt', c.qVersion())"

      - name: Ensure icon asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          png_path = Path("assets/pyBer_logo_big.png")
          ico_path = Path("assets/pyBer.ico")
          if not png_path.is_file():
              raise SystemExit(f"Missing required PNG icon source: {png_path}")
          if not ico_path.is_file():
              img = Image.open(png_path).convert("RGBA")
              img.save(ico_path, sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
              print(f"Generated missing icon: {ico_path}")
          else:
              print(f"Using checked-in icon: {ico_path}")
          PY

      - name: Verify build inputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy, scipy, h5py, sklearn

          required = [
              Path("pyBer.spec"),
              Path("pyBer-cli.spec"),
              Path("assets/pyBer_logo_big.png"),
              Path("assets/pyBer.ico"),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("Missing required build inputs: " + ", ".join(missing))

          print("Build inputs OK")
          print("Import smoke test OK")
          print("numpy:", numpy.__version__)
          print("scipy:", scipy.__version__)
          print("h5py:", h5py.__version__)
          print("sklearn:", sklearn.__version__)
          PY

      - name: Run regression tests
        run: python -m unittest discover -s tests -q

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean pyBer.spec
          python -m PyInstaller --noconfirm --clean pyBer-cli.spec

      - name: Smoke test built EXE
        run: |
          export PYBER_SMOKE_TEST=1
          ./dist/pyBer.exe
          ./dist/pyBer-cli.exe --version

      # The release gate that would have stopped v0.57: the packaged app (with
      # the Qt it actually bundles) opens every settings drawer and fails if a
      # numeric value is hidden or clipped.
      - name: Audit packaged UI
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:PYBER_UI_AUDIT = Join-Path $PWD "ui-audit"
          $p = Start-Process -FilePath "dist\pyBer.exe" -Wait -PassThru
          $report = Join-Path $env:PYBER_UI_AUDIT "ui_audit.json"
          if (-not (Test-Path $report)) { Write-Error "The packaged app wrote no UI audit report"; exit 1 }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host "Qt $($r.qt_version): $($r.numeric_fields_checked) numeric fields in $($r.views.Count) views, $($r.failures.Count) failures"
          foreach ($f in $r.failures) { Write-Host "::error::$($f.where) $($f.field) '$($f.text)': $($f.problem)" }
          exit $p.ExitCode

      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: ui-audit
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyber-windows-exe
          path: |
            dist/pyBer.exe
            dist/pyBer-cli.exe
          if-no-files-found: error

  publish:
    needs: [build-windows]
    if: |
      needs.build-windows.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && (
          startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'))
      )
    runs-on: ubuntu-latest
    # Main and tag runs of one commit publish one after the other; the second
    # finds the release already there and skips.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide release tag
        id: tag
        run: |
          set -euo pipefail
          tag="$(python3 scripts/release_tag.py)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyBer/version.py ($tag)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f "docs/releases/$tag.md" ]]; then
            echo "::error::New version $tag has no release notes: add docs/releases/$tag.md"
            exit 1
          fi
          echo "Publishing new release $tag"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download Windows Artifact
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pyber-windows-exe
          path: ./publish

      - name: Normalize Release Asset Name
        if: steps.tag.outputs.publish == 'true'
        run: |
          set -euo pipefail
          gui_path="$(find ./publish -type f -name 'pyBer.exe' | head -n 1 || true)"
          cli_path="$(find ./publish -type f -name 'pyBer-cli.exe' | head -n 1 || true)"
          if [[ -z "$gui_path" || -z "$cli_path" ]]; then
            echo "Expected GUI and CLI executables were not found"
            find ./publish -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$gui_path" ./publish/pyBer-windows.exe
          cp "$cli_path" ./publish/pyBer-cli-windows.exe
          (cd publish && sha256sum pyBer-windows.exe pyBer-cli-windows.exe > SHA256SUMS.txt)

      - name: Create Release
        if: steps.tag.outputs.publish == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./publish/pyBer-windows.exe,./publish/pyBer-cli-windows.exe,./publish/SHA256SUMS.txt"
          bodyFile: docs/releases/${{ steps.tag.outputs.tag }}.md
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          tag: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          commit: ${{ github.sha }}
          prerelease: false

      - name: Verify published assets
        if: steps.tag.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "${{ steps.tag.outputs.tag }}" -D verify
          (cd verify && sha256sum -c ../publish/SHA256SUMS.txt)
          echo "Published assets match the tested build."
